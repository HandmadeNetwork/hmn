{{ template "base-2024.html" . }}

{{ define "extrahead" }}
	<script type="module">
		import { initFollowLink } from '{{ static "js/project.js" }}';

		initFollowLink({
			csrfToken: '{{ and .Session .Session.CSRFToken }}',
			followUrl: '{{ .FollowUrl }}',
			projectId: '{{ .Project.ID }}',
			initialFollowing: {{ .Following }},
		});
	</script>
{{ end }}

{{ define "content" }}
<div class="flex justify-center">
	<div class="w-100 mw-site flex pv2 pv3-l ph2 ph0-l g3">
		<!-- Sidebar -->
		{{ template "project_sidebar.html" . }}

		<!-- Main content -->
		<div class="flex-grow-1">
			<!-- Screenshots -->
			<div id="screenshots" class="carousel-container">
				<div class="carousel">
					{{ range $i, $s := .Screenshots }}
						<div class="carousel-item {{ if eq $i 0 }}active{{ end }} aspect-ratio-real--16x9 relative">
							<img class="absolute left-0 top-0 w-100 h-100 object-cover bg1" src="{{ $s }}">
						</div>
					{{ end }}
					<div class="absolute left-0 bottom-0 right-0 ma2 flex justify-end">
						<div class="carousel-buttons pa2 br-pill bg-transparent-lighter"></div>
					</div>
				</div>
			</div>

			<!-- Description -->
			{{ if .Project.ParsedDescription }}
				<div id="longdesc" class="description w-100 pt3 post-content">
					{{ .Project.ParsedDescription }}
				</div>
			{{ end }}
		</div>
	</div>
</div>

{{ end }}
