<div class="project-logo" style="--hue: {{ .Flowsnake.Hue }}deg">
  {{ if .Logo }}
    <img src="{{ .Logo }}" class="aspect-ratio-real--1x1" alt="{{ .Name }} logo">
  {{ else }}
    <div class="project-logo-placeholder aspect-ratio-real--1x1">
      {{ cat .Name " " | trunc 1 | upper }}
    </div>
  {{ end }}
</div>
